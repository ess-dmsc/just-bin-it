version: '3.7'

services:
  kafka:
    image: wurstmeister/kafka:2.12-2.1.0
    depends_on:
      - zookeeper
    hostname: kafka
    platform: linux/amd64
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: ${JBI_KAFKA_ADVERTISED_HOST_NAME:-localhost}
      KAFKA_ADVERTISED_PORT: 9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_MESSAGE_MAX_BYTES: 10000000
      KAFKA_BROKER_ID: 0
      KAFKA_CREATE_TOPICS: "hist_commands:1:1,event_data:2:1,hist_topic:1:1,hist_responses:1:1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  zookeeper:
    image: zookeeper:3.4
    platform: linux/amd64

  just-bin-it:
    build:
      context: ..
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    depends_on:
      - kafka
    command:
      - just-bin-it
      - -b
      - ${JBI_KAFKA_BROKERS:-kafka:9092}
      - -t
      - hist_commands
      - -rt
      - hist_responses

  test-runner:
    image: ghcr.io/astral-sh/uv:0.10-python3.14-trixie-slim
    depends_on:
      - kafka
      - just-bin-it
    command: sleep infinity
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      JBI_KAFKA_BROKERS: ${JBI_KAFKA_BROKERS:-kafka:9092}
      JBI_JUST_BIN_IT_MANAGED_EXTERNALLY: "1"
      JBI_KAFKA_MANAGED_EXTERNALLY: ${JBI_KAFKA_MANAGED_EXTERNALLY:-}
      JBI_TEST_WORKDIR: ${JBI_TEST_WORKDIR:-/tmp/just-bin-it}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
