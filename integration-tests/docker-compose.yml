version: '3.7'

services:
  kafka:
    image: wurstmeister/kafka:2.12-2.1.0
    depends_on:
      - zookeeper
    hostname: kafka
    platform: linux/amd64
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: ${JBI_KAFKA_ADVERTISED_HOST_NAME:-localhost}
      KAFKA_ADVERTISED_PORT: 9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_MESSAGE_MAX_BYTES: 10000000
      KAFKA_BROKER_ID: 0
      KAFKA_CREATE_TOPICS: "hist_commands:1:1,event_data:2:1,hist_topic:1:1,hist_responses:1:1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  zookeeper:
    image: zookeeper:3.4
    platform: linux/amd64

  test-runner:
    image: registry.esss.lu.se/ecdc/ess-dmsc/docker-centos7-build-node:latest
    depends_on:
      - kafka
    command: sleep infinity
    environment:
      JBI_KAFKA_BROKERS: ${JBI_KAFKA_BROKERS:-localhost:9092}
      JBI_KAFKA_MANAGED_EXTERNALLY: ${JBI_KAFKA_MANAGED_EXTERNALLY:-}
      JBI_TEST_WORKDIR: ${JBI_TEST_WORKDIR:-/tmp/just-bin-it}
