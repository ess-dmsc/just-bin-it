workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

variables:
  UV_VERSION: "0.10"
  PYTHON_VERSION: "3.14"
  BASE_LAYER: trixie-slim
  UV_LINK_MODE: copy

default:
  tags:
    - docker
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

stages:
  - check
  - test
  - integration
  - release

checks:
  stage: check
  script:
    - uv run ruff check tests integration-tests just_bin_it
    - uv run ruff format --check tests integration-tests just_bin_it
    - uv run isort --check-only .

unit_tests:
  stage: test
  script:
    - uv run pytest tests/ --junitxml=test-output.xml
  artifacts:
    paths:
      - test-output.xml
    reports:
      junit: test-output.xml

coverage:
  stage: test
  script:
    - uv run pytest tests/ --cov=just_bin_it --cov-report term --cov-report xml:coverage.xml --junitxml=test-output.xml
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    paths:
      - coverage.xml
      - test-output.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: test-output.xml

build_package:
  stage: test
  script:
    - uv build
  artifacts:
    paths:
      - dist/

integration_tests:
  stage: integration
  image: docker:28
  resource_group: just-bin-it-integration-tests
  variables:
    JBI_COMPOSE_PROJECT: just-bin-it-$CI_JOB_ID
    JBI_KAFKA_ADVERTISED_HOST_NAME: kafka
    JBI_KAFKA_BROKERS: kafka:9092
    JBI_KAFKA_MANAGED_EXTERNALLY: "1"
    JBI_TEST_WORKDIR: /tmp/just-bin-it
  script:
    - cd integration-tests
    - ./setup.sh
    - ./run-integration-tests.sh
  after_script:
    - cd integration-tests && ./teardown.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 30m
  artifacts:
    when: always
    paths:
      - integration-tests/IntegrationTestsOutput.xml
    reports:
      junit: integration-tests/IntegrationTestsOutput.xml

publish_package:
  stage: release
  dependencies: []
  script:
    - uv version $CI_COMMIT_TAG
    - rm -rf dist
    - uv build
    - export UV_PUBLISH_USERNAME="ecdc"
    - export UV_PUBLISH_PASSWORD="$ESS_ARTIFACTORY_ECDC_PYPI_TOKEN"
    - uv publish --index ecdc-pypi
  rules:
    - if: $CI_COMMIT_TAG

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  script: echo "Running the release job for the new tag."
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release description"
  rules:
    - if: $CI_COMMIT_TAG

publish_docker_image:
  stage: release
  image: docker:28-cli
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - |
      docker build -t "$CI_REGISTRY_IMAGE:$DOCKER_IMAGE_TAG" \
        --build-arg JBI_VERSION="${CI_COMMIT_TAG:-}" \
        --build-arg https_proxy="$HTTPS_PROXY" \
        --build-arg http_proxy="$HTTP_PROXY" \
        .
    - docker push "$CI_REGISTRY_IMAGE:$DOCKER_IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        DOCKER_IMAGE_TAG: "latest"
    - if: $CI_COMMIT_TAG
      variables:
        DOCKER_IMAGE_TAG: "${CI_COMMIT_TAG}"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
  variables:
    HTTP_PROXY: "http://172.20.72.11:8888"
    HTTPS_PROXY: "http://172.20.72.11:8888"
